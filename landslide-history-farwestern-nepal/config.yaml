paths:
  input_dir: input
  output_dir: output

files:
  slope_units: farwest_su_final.gpkg
  events: dated_landslide_events_with_su_id.gpkg
  response_panel: landslide_response_panel_1992_2018.csv
  terrain: terrain_features.csv
  parent_material: parent_material_features.csv
  rainfall: rainfall_features_all_years_1992_2018.csv
  weights_candidates:
    - slopeunit_rainfall_grid_weights.csv
    - farwest_su_TPHiPr_overlap_weights.csv

analysis:
  seed: 20260824
  projected_crs: EPSG:32644
  observed_years: [1992, 1993, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
  missing_years: [1994, 1995]
  prediction_test_years: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
  expected_slope_units: 20574
  strict_expected_counts: false

recurrence:
  prior_burden_transform: log1p
  include_year_fixed_effects: true
  vcp_p: 0.5
  fe_p: 2.0
  maxiter: 1500
  gtol: 0.00001

temporal_null:
  chains: 3
  retained_draws: 9999
  burn_in_attempted_swaps: 100000
  thinning_attempted_swaps: 10000
  checkpoint_every: 50
  seeds: [20260831, 20260901, 20260902]

rainfall_ame:
  durations_days: [1, 3, 5, 7, 10, 15, 30]
  rainfall_columns:
    1: rx1day_mm
    3: rx3day_mm
    5: rx5day_mm
    7: rx7day_mm
    10: rx10day_mm
    15: rx15day_mm
    30: rx30day_mm
  standardization_rows: 5000
  standardization_seed: 20260824
  confidence_level: 0.95
  cluster_small_sample_correction: true
  static_predictors:
    - log_su_area
    - slope_median_deg
    - elev_median_m
    - relief_m
    - twi_median
    - distance_stream_median_m
    - northness_mean
    - eastness_mean
  # UF1 and UF2 are valid source classes.  They are harmonized to the common
  # rainfall-model level UF, matching the original Figure 4 model, but no
  # slope-unit records are excluded.
  parent_material_code_map:
    UF1: UF
    UF2: UF
  exclude_parent_material_codes: []

spatial_null:
  permutations: 9999
  seed: 20260910
  event_coordinate: representative_point
  coordinate_tolerance_m: 0.01
  deduplicate_fixed_locations: true
  year_shuffle_scope: within_slope_unit
  checkpoint_every: 100
  workers: 1

prediction:
  first_training_year: 1997
  test_years: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
  lagged_rainfall_columns: [monsoon_rainfall_mm, rx10day_mm, rx30day_mm]
  estimator: logistic_regression
  C: 1.0
  max_iter: 1000
  class_weight: null
  top_fractions: [0.01, 0.02, 0.05, 0.10]

static_predictors:
  - elev_min_m
  - elev_max_m
  - elev_std_m
  - elev_median_m
  - relief_m
  - slope_median_deg
  - slope_std_deg
  - slope_p90_deg
  - twi_median
  - tri_median
  - distance_stream_median_m
  - plan_curvature_median
  - profile_curvature_median
  - northness_mean
  - eastness_mean
  - log_su_area

categorical_predictors:
  - parent_material

history_predictors:
  - prior_failure
  - prior_active_years_log1p
  - prior_landslide_count_log1p
